<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Collections | LUXORA</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="wrap page-wrap">
            <div class="page-intro">
                <p class="eyebrow">FIND YOUR TIMEPIECE</p>
                <h1>Our Collections</h1>
                <p>Exceptional design, precision movement, and a style for every moment.</p>
            </div>
            <form class="filter-bar" th:action="@{/collections}" method="get">
                <input name="q" th:value="${q}" placeholder="Search watches or brands...">
                <select name="category">
                    <option value="">All collections</option>
                    <option>Classic</option>
                    <option>Heritage</option>
                    <option>Sport</option>
                    <option>Ladies</option>
                    <option>Limited Edition</option>
                </select>
                <select name="sort">
                    <option value="">Featured</option>
                    <option value="price-asc">Price: low to high</option>
                    <option value="price-desc">Price: high to low</option>
                    <option value="name">Name A–Z</option>
                </select>
                <button class="btn btn-gold" type="submit">Apply</button>
            </form>
            <p class="muted" th:text="${watches.size() + ' timepieces found'}">15 timepieces found</p>
            <div class="product-grid">
                <article class="product-card" th:each="w : ${watches}">
                    <a class="product-image" th:href="@{/watch/{id}(id=${w.id})}">
                        <img th:src="${w.imageUrl}" th:alt="${w.name}" loading="lazy">
                        <span class="product-tag" th:text="${w.category}">Classic</span>
                    </a>
                    <div class="product-info">
                        <p th:text="${w.brand}">Brand</p>
                        <h3 th:text="${w.name}">Watch name</h3>
                        <div class="price-line">
                            <strong th:text="${'₹' + #numbers.formatDecimal(w.price,1,'COMMA',2,'POINT')}">₹999</strong>
                            <del th:if="${w.oldPrice != null}" th:text="${'₹' + #numbers.formatDecimal(w.oldPrice,1,'COMMA',2,'POINT')}">₹1,199</del>
                        </div>
                        <a class="text-link" th:href="@{/watch/{id}(id=${w.id})}">View details ↗</a>
                    </div>
                </article>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(watches)}">No watches found. Try a different search or collection.</div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
