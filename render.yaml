services:
  - type: web
    name: luxora-watch-store
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: LUXORA_ADMIN_EMAIL
        sync: false
      - key: LUXORA_ADMIN_PASSWORD
        sync: false
